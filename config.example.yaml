cameras:
  - id: north_field
    host: 192.168.1.101
    username: admin
    password: "CHANGE_ME"
    rtsp_main: "rtsp://{username}:{password}@{host}:554/Preview_01_main"
    rtsp_sub: "rtsp://{username}:{password}@{host}:554/Preview_01_sub"
    onvif_port: 8000
    # motion_mask: # optional ignore-motion polygons (normalized 0..1) — roads/canopy/water
    #   - [[0.0, 0.7], [1.0, 0.7], [1.0, 1.0], [0.0, 1.0]] # ignore the bottom 30% (e.g. a road)
    # ignore_zones: # optional POST-DETECTION ignore polygons — drop boxes centred here (works for camera-motion too, unlike motion_mask). For a static object that reads as an animal at night.
    #   - [[0.0, 0.55], [0.16, 0.55], [0.16, 1.0], [0.0, 1.0]] # e.g. a bucket/post in the bottom-left corner
  - id: south_trail
    host: 192.168.1.102
    username: admin
    password: "CHANGE_ME"
    rtsp_main: "rtsp://{username}:{password}@{host}:554/Preview_01_main"
    rtsp_sub: "rtsp://{username}:{password}@{host}:554/Preview_01_sub"
    onvif_port: 8000

event_source: reolink_native # reolink_native | onvif_bridge

capture:
  burst_frames: 5 # grab this many frames per event
  burst_interval_ms: 200 # spacing between grabs
  stream: main # main | sub  (8GB is fine with main; sub is lighter)
  rtsp_timeout_s: 10
  max_concurrent: 1 # serialize capture+infer; one camera at a time

detection:
  model_path: "models/yolov8s.pt" # Ultralytics weights; or a .mlpackage for Core ML
  device: "mps" # mps | cpu  (mps = M1 GPU)
  animal_classes: # COCO subset treated as "wildlife"
    - bird
    - cat
    - dog
    - horse
    - sheep
    - cow
    - bear
    - elephant
    - zebra
    - giraffe
  confidence_threshold: 0.55 # tune: raise for fewer false positives
  min_box_area_frac: 0.01 # ignore specks < 1% of frame area
  save_best_only: true # one best frame per event (vs all positives)
  max_saturated_frac: 0.20 # drop boxes >=20% blown-out white (IR blooms from an insect/dew at the illuminator). 1.0 disables
  max_ir_box_brightness: 0 # night-insect gate: in an IR frame, drop a box brighter than this x the frame (moths at the illuminator glow). Animals near the camera glow too (bobcat 1.5x), so leave 0 (off) unless wildlife-replay shows no real loss on your cameras; wildlife-review handles insects instead

dedupe:
  cooldown_s: 30 # suppress re-triggers from same camera within window

storage:
  captures_dir: "~/wildlife/captures"
  db_path: "~/wildlife/captures.db"
  jpeg_quality: 85
  thumbnail_px: 320

retention:
  # Human-reviewed captures (reclassified or marked reviewed in /admin/captures)
  # are exempt from min_confidence_keep, but still subject to max_age_days.
  max_age_days: 30 # prune.py deletes captures older than this
  min_confidence_keep: 0.0 # optionally also prune low-confidence captures

gallery:
  host: "0.0.0.0" # bind to LAN
  port: 8080
  page_size: 60
  live_refresh_seconds: 3.0 # push new captures to open browsers via SSE; 0 disables
  max_live_streams: 12 # ceiling on simultaneous live-update connections

resource_guard: # be a good co-tenant with the media server
  detect_every_nth_event: 1 # raise to skip events if GPU contention ever appears
  max_burst_per_minute: 20 # hard cap on how often we'll fire inference

livestream: # optional on-demand live view via a companion go2rtc binary (detector untouched)
  enabled: false # set true to expose /live in the gallery
  go2rtc_port: 1984 # browser-reachable go2rtc api port
  go2rtc_url: null # full base override e.g. "http://192.168.1.50:1984"; null = derive from request host
  api_listen: ":1984" # go2rtc api bind (for generated go2rtc.yaml)
  webrtc_listen: ":8555" # go2rtc webrtc bind
  rtsp_listen: ":8554" # go2rtc rtsp bind
  default_stream: sub # sub | main  (sub is lighter; main is 4K)
  allow_main: true # expose the Main 4K toggle in the UI
  # go2rtc player transport per tile. The player prefers MSE whenever "mse" is in
  # the list (order is ignored), so omit "mse" to force WebRTC. Reolink 4K main is
  # HEVC (MSE plays it in Safari); the sub is H264 High profile which Safari MSE
  # rejects but WebRTC decodes -- hence the split.
  main_mode: "webrtc,mse" # HEVC 4K main -> MSE
  sub_mode: "webrtc" # H264 High sub -> WebRTC
  base_path: "" # set "/go2rtc" to serve go2rtc under a sub-path for Cloudflare-Tunnel remote access
  # Optional MJPEG restreams for clients that can't decode H.264/H.265 (the /frame kiosk).
  # Emits <id>_mjpeg (from _sub) and <id>_mjpeg_hd (from _main) in the generated go2rtc.yaml.
  # mjpeg:
  #   fps: 4          # frames per second
  #   quality: 7      # ffmpeg -q:v for <id>_mjpeg (2=best .. 31=worst), ~30 KB at 640x360
  #   hd_width: 1280  # width of <id>_mjpeg_hd
  #   hd_quality: 14  # ffmpeg -q:v for <id>_mjpeg_hd, ~70-100 KB at 1280x720

remote: # optional Cloudflare-Tunnel remote access (see README "Remote access")
  enabled: false # set by `wildlife-share-secret`; gates tunnel traffic with a shared-secret link
  base_url: "" # your public URL, e.g. "https://cam.example.com" (used to build the share link)
  share_secret_hash: null # Werkzeug hash of the shared secret; managed by `wildlife-share-secret`
  block_admin: true # refuse /admin over the tunnel (config editing stays LAN-only)

continuous: # optional always-on motion-gated detection (your model becomes the gate)
  enabled: false # set true to run a second, MOG2-motion-gated producer per camera
  sample_fps: 4 # frames/sec sampled from the sub restream for motion (not full fps)
  downscale_width: 480 # px width the motion detector runs at (motion computed downscaled)
  min_area_frac: 0.003 # largest motion contour must be >= this fraction of the frame
  refractory_s: 8 # min seconds between motion emits per camera (one animal -> one event)
  warmup_s: 10 # suppress emits this long after (re)connect while MOG2 stabilizes
  algorithm: mog2 # mog2 | frame_diff
  active_hours: "" # optional "HH:MM-HH:MM" local window; empty = 24/7

audio: # optional BirdNET audio bird-ID (CPU-side; needs the go2rtc daemon + camera audio)
  enabled: false # set true to run a per-camera BirdNET analyzer
  stream: sub # sub | main — which go2rtc restream carries the mic (some Reolink only on main)
  latitude: 37.2 # rounded placeholder — put your real coordinates in config.yaml
  longitude: -107.5
  use_geo_filter: true # restrict to species plausible at your location/season
  confidence_threshold: 0.25 # BirdNET score gate; raise to cut wind/noise
  bandpass_fmin: 0 # Hz; raise (e.g. 300) to band-limit low-frequency wind
  min_confirmations: 2 # same species N times within confirm_window_s before saving
  confirm_window_s: 15
  dedup_window_s: 900 # keep only the BEST (highest-confidence) sample per species within this many seconds; a clearer/louder later call replaces the saved one. 0 = save every confirmed detection
  active_hours: "" # optional "HH:MM-HH:MM" local; empty = 24/7
  species_hours: {} # per-species local "HH:MM-HH:MM"; drop a species outside its window. For diurnal birds whose nocturnal "detections" are insect stridulation, e.g. {"Canyon Wren": "05:00-21:00"}. Unlisted species (owls/nighthawks) stay 24/7.
  clip_audio_filter: "highpass=f=200,afftdn=nr=20:nf=-25,speechnorm=e=25:r=0.0005" # de-wind the SAVED playback clip only (detection runs on raw audio); ffmpeg -af chain. "" = save raw

megadetector: # optional MegaDetector v6 second pass over the species detector (per-event)
  enabled: false # set true to run the second pass (needs weights/MDV6-yolov10e.pt + the [detect] extra)
  weights_path: "weights/MDV6-yolov10e.pt" # MDv6 ultralytics .pt (gitignored; from Zenodo)
  confidence: 0.2 # MD detection score floor (camera-trap default)
  imgsz: 1280 # MDv6 was trained at 1280
  iou_match: 0.45 # IoU to treat an MD box as the same box as a species detection
  classes: [person, animal] # actionable MD classes; add "vehicle" for a driveway/gate camera
  person_override: true # relabel a kept detection to person when MD sees a person on it
  rescue_misses: true # save an MD animal/person when the species model kept nothing
  rescue_min_confidence: 0.5 # rescue bypasses the species gate + saves a generic label, so require this (higher than `confidence`) to avoid saving low-conf/hiccup detections
  rescue_cooldown_s: 0 # per-camera min seconds between rescue MD runs; raise (e.g. 15) on a motion-heavy camera so wind-blown vegetation doesn't fire the heavy 1280px pass every event
  suppress_false_positives: false # drop a kept detection MD sees nothing behind (opt-in; MD can miss too)

frame: # optional LAN-only kiosk dashboard at /frame (needs livestream.enabled + livestream.mjpeg)
  enabled: false
  cameras: [] # on-screen order of camera ids; empty = all cameras
  refresh_seconds: 15 # how often the page polls /frame/state
  dim: # night dimming of the frame's backlight; set `dim: null` to disable
    start: "22:00"
    end: "06:30" # windows may wrap past midnight
    level: 0.12 # 0..1 backlight while dimmed; camera images fade further, text turns red
    wake_seconds: 60 # full brightness after a tap

homeassistant: # read-only source for the /frame strip; the token never leaves this server
  url: "" # e.g. http://192.168.1.33:8123
  token: "" # long-lived access token of a dedicated non-admin HA user
  timeout_seconds: 3
  entities: [] # allow-list, e.g.
  #  - {id: weather.forecast_home, slot: weather}
  #  - {id: sensor.outdoor_temperature, slot: temps, label: Outside}
  #  - {id: climate.thermostat, slot: temps, label: Inside}
  #  - {id: sensor.house_power, slot: energy, label: House}

review: # optional Claude-vision review of saved captures (wildlife-review; launchd/com.wildlife.review.plist runs it every 15 minutes). While enabled, /frame shows only confirmed sightings
  enabled: false # set true to let the scheduled job run (manual `wildlife-review run --dry-run` works regardless)
  backend: claude_cli # claude_cli = the `claude` CLI on its own login (a Claude subscription, no API key) | api = Anthropic API key
  model: claude-opus-5-5
  effort: low # low | medium | high | xhigh | max
  delete_min_confidence: 0.6 # a not_animal verdict this sure deletes (the reviewer only says not_animal when it can name the artifact); unsure always keeps. Human-reviewed captures are never deleted
  relabel: true # give confirmed animals the species the reviewer names (detector label kept in review_log). Human labels are never changed
  extra_species: [dog, cat, horse, cattle] # species the reviewer may name beyond detection.animal_classes
  max_per_run: 300 # requests per run (one per object per burst event)
  concurrency: 4
  max_plan_utilization: 0.8 # claude_cli: stop a run once the plan's 5-hour or weekly usage passes this (rest waits for the next run). 1.0 disables
  claude_bin: claude # claude_cli: CLI path; bare names are also looked up in /opt/homebrew/bin, /usr/local/bin, ~/.local/bin
  oauth_token_file: "~/.config/wildlife/claude_oauth_token" # claude_cli, optional: a `claude setup-token` token for where the keychain login is unreachable
  api_key_file: "~/.config/wildlife/anthropic_api_key" # api: used when ANTHROPIC_API_KEY / an `ant auth login` profile is absent. Keep keys out of this file
