cameras:
  - id: north_field
    host: 192.168.1.101
    username: admin
    password: "CHANGE_ME"
    rtsp_main: "rtsp://{username}:{password}@{host}:554/Preview_01_main"
    rtsp_sub: "rtsp://{username}:{password}@{host}:554/Preview_01_sub"
    onvif_port: 8000
    # motion_mask: # optional ignore-motion polygons (normalized 0..1) — roads/canopy/water
    #   - [[0.0, 0.7], [1.0, 0.7], [1.0, 1.0], [0.0, 1.0]] # ignore the bottom 30% (e.g. a road)
  - id: south_trail
    host: 192.168.1.102
    username: admin
    password: "CHANGE_ME"
    rtsp_main: "rtsp://{username}:{password}@{host}:554/Preview_01_main"
    rtsp_sub: "rtsp://{username}:{password}@{host}:554/Preview_01_sub"
    onvif_port: 8000

event_source: reolink_native # reolink_native | onvif_bridge

capture:
  burst_frames: 5 # grab this many frames per event
  burst_interval_ms: 200 # spacing between grabs
  stream: main # main | sub  (8GB is fine with main; sub is lighter)
  rtsp_timeout_s: 10
  max_concurrent: 1 # serialize capture+infer; one camera at a time

detection:
  model_path: "models/yolov8s.pt" # Ultralytics weights; or a .mlpackage for Core ML
  device: "mps" # mps | cpu  (mps = M1 GPU)
  animal_classes: # COCO subset treated as "wildlife"
    - bird
    - cat
    - dog
    - horse
    - sheep
    - cow
    - bear
    - elephant
    - zebra
    - giraffe
  confidence_threshold: 0.55 # tune: raise for fewer false positives
  min_box_area_frac: 0.01 # ignore specks < 1% of frame area
  save_best_only: true # one best frame per event (vs all positives)

dedupe:
  cooldown_s: 30 # suppress re-triggers from same camera within window

storage:
  captures_dir: "~/wildlife/captures"
  db_path: "~/wildlife/captures.db"
  jpeg_quality: 85
  thumbnail_px: 320

retention:
  # Human-reviewed captures (reclassified or marked reviewed in /admin/captures)
  # are exempt from min_confidence_keep, but still subject to max_age_days.
  max_age_days: 30 # prune.py deletes captures older than this
  min_confidence_keep: 0.0 # optionally also prune low-confidence captures

gallery:
  host: "0.0.0.0" # bind to LAN
  port: 8080
  page_size: 60

resource_guard: # be a good co-tenant with the media server
  detect_every_nth_event: 1 # raise to skip events if GPU contention ever appears
  max_burst_per_minute: 20 # hard cap on how often we'll fire inference

livestream: # optional on-demand live view via a companion go2rtc binary (detector untouched)
  enabled: false # set true to expose /live in the gallery
  go2rtc_port: 1984 # browser-reachable go2rtc api port
  go2rtc_url: null # full base override e.g. "http://192.168.1.50:1984"; null = derive from request host
  api_listen: ":1984" # go2rtc api bind (for generated go2rtc.yaml)
  webrtc_listen: ":8555" # go2rtc webrtc bind
  rtsp_listen: ":8554" # go2rtc rtsp bind
  default_stream: sub # sub | main  (sub is lighter; main is 4K)
  allow_main: true # expose the Main 4K toggle in the UI
  # go2rtc player transport per tile. The player prefers MSE whenever "mse" is in
  # the list (order is ignored), so omit "mse" to force WebRTC. Reolink 4K main is
  # HEVC (MSE plays it in Safari); the sub is H264 High profile which Safari MSE
  # rejects but WebRTC decodes -- hence the split.
  main_mode: "webrtc,mse" # HEVC 4K main -> MSE
  sub_mode: "webrtc" # H264 High sub -> WebRTC
  base_path: "" # set "/go2rtc" to serve go2rtc under a sub-path for Cloudflare-Tunnel remote access

remote: # optional Cloudflare-Tunnel remote access (see README "Remote access")
  enabled: false # set by `wildlife-share-secret`; gates tunnel traffic with a shared-secret link
  base_url: "" # your public URL, e.g. "https://cam.rlblais.org" (used to build the share link)
  share_secret_hash: null # Werkzeug hash of the shared secret; managed by `wildlife-share-secret`
  block_admin: true # refuse /admin over the tunnel (config editing stays LAN-only)

continuous: # optional always-on motion-gated detection (your model becomes the gate)
  enabled: false # set true to run a second, MOG2-motion-gated producer per camera
  sample_fps: 4 # frames/sec sampled from the sub restream for motion (not full fps)
  downscale_width: 480 # px width the motion detector runs at (motion computed downscaled)
  min_area_frac: 0.003 # largest motion contour must be >= this fraction of the frame
  refractory_s: 8 # min seconds between motion emits per camera (one animal -> one event)
  warmup_s: 10 # suppress emits this long after (re)connect while MOG2 stabilizes
  algorithm: mog2 # mog2 | frame_diff
  active_hours: "" # optional "HH:MM-HH:MM" local window; empty = 24/7

audio: # optional BirdNET audio bird-ID (CPU-side; needs the go2rtc daemon + camera audio)
  enabled: false # set true to run a per-camera BirdNET analyzer
  stream: sub # sub | main — which go2rtc restream carries the mic (some Reolink only on main)
  latitude: 37.2 # rounded placeholder — put your real coordinates in config.yaml
  longitude: -107.5
  use_geo_filter: true # restrict to species plausible at your location/season
  confidence_threshold: 0.25 # BirdNET score gate; raise to cut wind/noise
  bandpass_fmin: 0 # Hz; raise (e.g. 300) to band-limit low-frequency wind
  min_confirmations: 2 # same species N times within confirm_window_s before saving
  confirm_window_s: 15
  cooldown_s: 30 # per-species suppression after a save
  active_hours: "" # optional "HH:MM-HH:MM" local; empty = 24/7
