{% extends "admin/base.html" %}
{% block title %}Password{% endblock %}
{% block content %}
<form class="admin-form" method="post" action="{{ url_for('admin.password') }}">
  <fieldset class="panel">
    <legend>Change admin password</legend>
    <p class="muted">Only the hash is stored in <code>config.yaml</code>. After changing it,
       your browser may prompt you to re-authenticate.</p>
    <label class="field"><span>New password (min 8 chars)</span>
      <input type="password" name="password" required minlength="8" autocomplete="new-password"></label>
    <label class="field"><span>Confirm password</span>
      <input type="password" name="confirm" required minlength="8" autocomplete="new-password"></label>
  </fieldset>
  <div class="form-actions">
    <button type="submit" class="btn primary">Update password</button>
    <a class="btn ghost" href="{{ url_for('admin.dashboard') }}">Cancel</a>
  </div>
</form>
{% endblock %}
