<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, initial-scale=1, user-scalable=no">
<title>Frame</title>
<link rel="stylesheet" href="{{ url_for('static', filename='frame.css') }}">
</head>
<body>
<main id="frame"{% if dim.active %} class="night"{% endif %} data-refresh="{{ refresh_seconds }}"
      data-dim-active="{{ 'true' if dim.active else 'false' }}" data-dim-level="{{ dim.level }}"
      data-dim-wake="{{ dim.wake_seconds }}">
  <section class="cams">
  {% if mjpeg_enabled %}
  {% for cam in cameras %}
    <figure class="tile" data-id="{{ cam.id }}" data-src="{{ cam.mjpeg }}" data-hd="{{ cam.mjpeg_hd }}">
      <img alt="">
      <figcaption>{{ cam.label }}</figcaption>
      <span class="badge" hidden>reconnecting</span>
    </figure>
  {% endfor %}
  {% else %}
    <p class="notice">Set livestream.mjpeg in config.yaml to show cameras.</p>
  {% endif %}
  </section>
  <section class="strip" id="strip">
    <div class="clock">
      <div id="time"><span id="hm">--:--</span><span id="ampm"></span></div><div id="date"></div>
      <div id="sighting" class="sighting" hidden><img alt=""><div class="cap"></div></div>
    </div>
    <div class="mid">
      <div class="weather" id="weather"></div>
      <div id="bird" class="bird" hidden><img alt=""><div class="cap"></div></div>
    </div>
    <div id="values"></div>
  </section>
  <span id="offline" class="badge" hidden>server offline</span>
  <div id="dimmer" hidden></div>
  <figure id="full" hidden><img alt=""><figcaption></figcaption></figure>
  <section id="birds" hidden>
    <header><span>Recent birds</span><button id="birds-close" type="button">✕</button></header>
    <ul id="bird-list"></ul>
  </section>
  <audio id="player" preload="none"></audio>
</main>
<script>
(function () {
  "use strict";
  var root = document.getElementById("frame");
  var REFRESH_MS = parseInt(root.getAttribute("data-refresh"), 10) * 1000;
  var STREAM_REFRESH_MS = 5 * 60 * 1000;
  var FULL_TIMEOUT_MS = 60 * 1000;
  var tiles = Array.prototype.slice.call(document.querySelectorAll(".tile"));
  var full = document.getElementById("full");
  var fullImg = full.querySelector("img");
  var offset = 0;          // server clock minus local clock (ms)
  var failures = 0;
  // Start from the server-rendered state so a (nightly) reload never flashes to full brightness.
  var dim = {
    active: root.getAttribute("data-dim-active") === "true",
    level: parseFloat(root.getAttribute("data-dim-level")),
    wake: parseInt(root.getAttribute("data-dim-wake"), 10)
  };
  var wakeUntil = 0;
  var dimmed = null;
  var fullTimer = null;
  var started = Date.now();

  function bust(url) { return url + (url.indexOf("?") < 0 ? "?" : "&") + "t=" + Date.now(); }
  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) { node.className = cls; }
    if (text !== undefined) { node.textContent = text; }
    return node;
  }
  function clear(node) { while (node.firstChild) { node.removeChild(node.firstChild); } }

  // ---- camera streams ---------------------------------------------------
  function attach(tile) {
    var img = tile.querySelector("img");
    var badge = tile.querySelector(".badge");
    clearTimeout(tile._retry);
    clearTimeout(tile._shown);
    tile._backoff = tile._backoff || 5000;
    function up() { clearTimeout(tile._shown); tile.className = "tile"; badge.hidden = true; }
    // MJPEG <img> may never fire "load" in some WebViews: treat 3 s without an error as up.
    tile._shown = setTimeout(up, 3000);
    img.onload = function () { up(); tile._backoff = 5000; };
    img.onerror = function () {
      clearTimeout(tile._shown);
      tile.className = "tile down";   // hides the broken-image placeholder
      badge.hidden = false;
      clearTimeout(tile._retry);
      tile._retry = setTimeout(function () { if (streamsWanted()) { attach(tile); } }, tile._backoff);
      tile._backoff = Math.min(tile._backoff * 2, 60000);
    };
    img.src = bust(tile.getAttribute("data-src"));
  }
  function detach(tile) {
    var img = tile.querySelector("img");
    clearTimeout(tile._retry);
    clearTimeout(tile._shown);
    img.onerror = null;
    img.removeAttribute("src");   // aborts the MJPEG download
  }
  function attachAll() { tiles.forEach(attach); }
  function streamsWanted() { return full.hidden && birdsPanel.hidden; }

  function openFull(tile) {
    tiles.forEach(detach);
    full.querySelector("figcaption").textContent = tile.querySelector("figcaption").textContent;
    fullImg.onerror = function () {
      setTimeout(function () { if (!full.hidden) { fullImg.src = bust(tile.getAttribute("data-hd")); } }, 5000);
    };
    fullImg.src = bust(tile.getAttribute("data-hd"));
    full.hidden = false;
    clearTimeout(fullTimer);
    fullTimer = setTimeout(closeFull, FULL_TIMEOUT_MS);
  }
  function closeFull() {
    clearTimeout(fullTimer);
    fullImg.onerror = null;
    fullImg.removeAttribute("src");
    full.hidden = true;
    attachAll();
  }

  // ---- dimming ----------------------------------------------------------
  function setBrightness(level) {
    if (window.FrameNative && window.FrameNative.setBrightness) {
      window.FrameNative.setBrightness(level);
      return;
    }
    var shade = document.getElementById("dimmer");   // desktop fallback for testing
    shade.hidden = level < 0;
    shade.style.opacity = String(Math.min(0.97, 1 - Math.max(level, 0)));
  }
  function applyDim() {
    var want = dim.active && Date.now() >= wakeUntil;
    if (want === dimmed) { return; }
    dimmed = want;
    root.className = want ? "night" : "";   // red text; cameras fade further than the text
    setBrightness(want ? dim.level : -1);
  }
  function wake() { wakeUntil = Date.now() + dim.wake * 1000; applyDim(); }

  // ---- taps -------------------------------------------------------------
  function handleTap(action) {
    return function () {
      if (dim.active && Date.now() >= wakeUntil) { wake(); return; }  // first tap only wakes
      if (dim.active) { wake(); }
      action(this);
    };
  }
  tiles.forEach(function (tile) { tile.addEventListener("click", handleTap(openFull)); });
  full.addEventListener("click", handleTap(closeFull));
  document.getElementById("strip").addEventListener("click", handleTap(function () {}));

  // ---- Home Assistant strip ---------------------------------------------
  function render(ha) {
    var weather = document.getElementById("weather");
    var values = document.getElementById("values");
    clear(weather);
    clear(values);
    // Only the HA values fade when stale; the clock keeps full brightness.
    weather.className = ha.stale ? "weather stale" : "weather";
    values.className = ha.stale ? "stale" : "";
    ha.items.forEach(function (item) {
      if (item.slot === "weather" && !weather.firstChild) {
        weather.appendChild(el("div", "temp", item.display));
        weather.appendChild(el("div", "cond", item.detail));
        if (ha.forecast && ha.forecast.display) {   // formatted server-side; never "L 0°"
          weather.appendChild(el("div", "hilo", ha.forecast.display));
        }
        return;
      }
      var row = el("div", "row");
      row.appendChild(el("span", "label", item.label));
      row.appendChild(el("span", "value", item.display));
      values.appendChild(row);
    });
    if (ha.stale && ha.age_seconds !== null) {
      values.appendChild(el("div", "age", "updated " + Math.round(ha.age_seconds / 60) + " min ago"));
    }
  }

  // ---- polling ----------------------------------------------------------
  function fail() {
    failures += 1;
    if (failures >= 3) { document.getElementById("offline").hidden = false; }
  }
  function poll() {
    var xhr = new XMLHttpRequest();
    xhr.open("GET", "/frame/state", true);
    xhr.timeout = 8000;
    xhr.onload = function () {
      var state;
      if (xhr.status !== 200) { fail(); return; }
      try { state = JSON.parse(xhr.responseText); } catch (e) { fail(); return; }
      if (failures >= 3 && streamsWanted()) { attachAll(); }   // server is back: reconnect streams
      failures = 0;
      document.getElementById("offline").hidden = true;
      offset = state.now * 1000 - Date.now();
      dim = { active: state.dim.active, level: state.dim.level, wake: state.dim.wake_seconds };
      applyDim();
      render(state.ha);
    };
    xhr.onerror = fail;
    xhr.ontimeout = fail;
    xhr.send();
  }

  // ---- wildlife sighting + birds ------------------------------------------
  var WILDLIFE_MS = 60 * 1000;
  var BIRDS_IDLE_MS = 60 * 1000;
  var birdsPanel = document.getElementById("birds");
  var player = document.getElementById("player");
  var birdsTimer = null;
  var latestBirds = [];
  var playingButton = null;

  function showThumb(box, url, text) {
    var img = box.querySelector("img");
    if (url) { img.src = url; img.hidden = false; } else { img.hidden = true; }
    box.querySelector(".cap").textContent = text;
    box.hidden = false;
  }
  function renderWildlife(w) {
    var sighting = document.getElementById("sighting");
    var bird = document.getElementById("bird");
    if (w.sighting) {
      showThumb(sighting, w.sighting.thumb_url, w.sighting.label + " \u00b7 " + w.sighting.time);
    } else { sighting.hidden = true; }
    latestBirds = w.birds || [];
    if (latestBirds.length) {
      showThumb(bird, latestBirds[0].photo_url, latestBirds[0].label + " \u00b7 " + latestBirds[0].time);
    } else { bird.hidden = true; }
  }
  function pollWildlife() {
    var xhr = new XMLHttpRequest();
    xhr.open("GET", "/frame/wildlife", true);
    xhr.timeout = 8000;
    xhr.onload = function () {
      if (xhr.status !== 200) { return; }
      try { renderWildlife(JSON.parse(xhr.responseText)); } catch (e) { /* keep the last panel */ }
    };
    xhr.send();
  }
  function resetPlaying() {
    if (playingButton) { playingButton.textContent = "\u25B6"; playingButton = null; }
  }
  function playClip(url, button) {
    bumpBirds();
    if (playingButton === button && !player.paused) { player.pause(); resetPlaying(); return; }
    resetPlaying();
    player.src = url;
    var started = player.play();
    if (started && started.catch) { started.catch(resetPlaying); }
    button.textContent = "\u25A0";
    playingButton = button;
  }
  player.addEventListener("ended", resetPlaying);
  player.addEventListener("error", resetPlaying);
  function renderBirdList() {
    var list = document.getElementById("bird-list");
    clear(list);
    latestBirds.forEach(function (bird) {
      var row = el("li", "bird-row");
      var img = el("img");
      img.alt = "";
      if (bird.photo_url) { img.src = bird.photo_url; }
      row.appendChild(img);
      var text = el("div", "bird-text");
      text.appendChild(el("div", "bird-name", bird.label));
      text.appendChild(el("div", "bird-meta", bird.time + (bird.confidence ? " \u00b7 " + bird.confidence : "")));
      row.appendChild(text);
      if (bird.audio_url) {
        var play = el("button", "play", "\u25B6");
        play.type = "button";
        play.addEventListener("click", function (ev) { ev.stopPropagation(); playClip(bird.audio_url, play); });
        row.appendChild(play);
      }
      list.appendChild(row);
    });
  }
  function bumpBirds() { clearTimeout(birdsTimer); birdsTimer = setTimeout(closeBirds, BIRDS_IDLE_MS); }
  function openBirds() {
    if (!latestBirds.length) { return; }
    tiles.forEach(detach);
    renderBirdList();
    birdsPanel.hidden = false;
    bumpBirds();
  }
  function closeBirds() {
    clearTimeout(birdsTimer);
    player.pause();
    player.removeAttribute("src");
    resetPlaying();
    birdsPanel.hidden = true;
    if (full.hidden) { attachAll(); }
  }
  document.getElementById("bird").addEventListener("click", handleTap(openBirds));
  document.getElementById("birds-close").addEventListener("click", function (ev) {
    ev.stopPropagation();
    closeBirds();
  });
  birdsPanel.addEventListener("click", bumpBirds);

  // ---- clock + housekeeping ---------------------------------------------
  function tick() {
    var now = new Date(Date.now() + offset);
    // "4:18 PM" -> big "4:18" + small "PM" (newer ICU separates them with U+202F, which \s matches)
    var parts = now.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }).split(/\s+/);
    document.getElementById("hm").textContent = parts[0];
    document.getElementById("ampm").textContent = parts.slice(1).join(" ");
    document.getElementById("date").textContent =
      now.toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" });
    applyDim();
    if (now.getHours() === 4 && now.getMinutes() === 0 && Date.now() - started > 120000) {
      location.reload();   // daily fresh start to shed leaks on the 1 GB frame
    }
  }

  attachAll();
  poll();
  tick();
  setInterval(poll, REFRESH_MS);
  setInterval(tick, 1000);
  setInterval(function () { if (streamsWanted()) { attachAll(); } }, STREAM_REFRESH_MS);
  pollWildlife();
  setInterval(pollWildlife, WILDLIFE_MS);
}());
</script>
</body>
</html>
