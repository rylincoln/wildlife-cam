<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, initial-scale=1, user-scalable=no">
<title>Frame</title>
<link rel="stylesheet" href="{{ url_for('static', filename='frame.css') }}">
</head>
<body>
<main id="frame"{% if dim.active %} class="night"{% endif %} data-refresh="{{ refresh_seconds }}"
      data-dim-active="{{ 'true' if dim.active else 'false' }}" data-dim-level="{{ dim.level }}"
      data-dim-wake="{{ dim.wake_seconds }}" data-dim-start="{{ dim.start or '' }}"
      data-dim-end="{{ dim.end or '' }}">
  <section class="cams">
  {% if mjpeg_enabled %}
  {% for cam in cameras %}
    <figure class="tile" data-id="{{ cam.id }}" data-src="{{ cam.mjpeg }}" data-hd="{{ cam.mjpeg_hd }}">
      <img alt="">
      <figcaption>{{ cam.label }}</figcaption>
      <span class="badge" hidden>reconnecting</span>
    </figure>
  {% endfor %}
  {% else %}
    <p class="notice">Enable livestream (with livestream.mjpeg) in config.yaml to show cameras.</p>
  {% endif %}
  </section>
  <section class="strip" id="strip">
    <div class="clock">
      <div id="time"><span id="hm">--:--</span><span id="ampm"></span></div><div id="date"></div>
      <div id="sighting" class="sighting" hidden><img alt=""><div class="cap"></div></div>
      <div id="bird" class="bird" hidden><img alt=""><div class="cap"></div></div>
    </div>
    <div class="mid">
      <div class="weather" id="weather"></div>
      <div id="rain" class="rain"></div>
      <div id="conditions" class="rain conditions"></div>
    </div>
    <div id="values"></div>
  </section>
  <span id="offline" class="badge" hidden>server offline</span>
  <div id="dimmer" hidden></div>
  <figure id="full" hidden><img alt=""><figcaption></figcaption><span class="badge" hidden>reconnecting</span></figure>
  <section id="birds" hidden>
    <header><span>Recent birds</span><button id="birds-close" type="button">✕</button></header>
    <ul id="bird-list"></ul>
  </section>
  <section id="sightings" hidden>
    <header><span>Recent sightings</span><button id="sightings-close" type="button">✕</button></header>
    <ul id="sighting-list"></ul>
    <figure id="sighting-view" hidden><img alt=""><figcaption></figcaption></figure>
  </section>
  <audio id="player" preload="none"></audio>
</main>
<script>
(function () {
  "use strict";
  var root = document.getElementById("frame");
  var REFRESH_MS = parseInt(root.getAttribute("data-refresh"), 10) * 1000;
  var STREAM_REFRESH_MS = 5 * 60 * 1000;
  var tiles = Array.prototype.slice.call(document.querySelectorAll(".tile"));
  var full = document.getElementById("full");
  var fullImg = full.querySelector("img");
  var offset = 0;          // server clock minus local clock (ms)
  var failures = 0;
  // Start from the server-rendered state so a (nightly) reload never flashes to full brightness.
  var dim = {
    active: root.getAttribute("data-dim-active") === "true",
    level: parseFloat(root.getAttribute("data-dim-level")),
    wake: parseInt(root.getAttribute("data-dim-wake"), 10),
    start: root.getAttribute("data-dim-start"),
    end: root.getAttribute("data-dim-end")
  };
  var wakeUntil = 0;
  var dimmed = null;
  var appliedLevel = null;
  var fullTile = null;     // camera shown full screen (stays until tapped)
  var fullRetry = null;
  var fullBadge = full.querySelector(".badge");
  var started = Date.now();

  function bust(url) { return url + (url.indexOf("?") < 0 ? "?" : "&") + "t=" + Date.now(); }
  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) { node.className = cls; }
    if (text !== undefined) { node.textContent = text; }
    return node;
  }
  function clear(node) { while (node.firstChild) { node.removeChild(node.firstChild); } }

  // ---- camera streams ---------------------------------------------------
  function attach(tile) {
    var img = tile.querySelector("img");
    var badge = tile.querySelector(".badge");
    clearTimeout(tile._retry);
    clearTimeout(tile._shown);
    tile._pending = false;
    tile._since = Date.now();
    tile._backoff = tile._backoff || 5000;
    function up() {
      clearTimeout(tile._shown);
      tile.className = "tile";
      badge.hidden = true;
      tile._backoff = 5000;
    }
    // MJPEG <img> may never fire "load" in some WebViews: treat 3 s without an error as up.
    tile._shown = setTimeout(up, 3000);
    img.onload = up;
    img.onerror = function () {
      if (tile._pending) { return; }   // a reconnect is already scheduled
      tile._pending = true;
      clearTimeout(tile._shown);
      tile.className = "tile down";   // hides the broken-image placeholder
      badge.hidden = false;
      clearTimeout(tile._retry);
      tile._retry = setTimeout(function () { if (streamsWanted()) { attach(tile); } }, tile._backoff);
      tile._backoff = Math.min(tile._backoff * 2, 60000);
    };
    img.src = bust(tile.getAttribute("data-src"));
  }
  function detach(tile) {
    var img = tile.querySelector("img");
    clearTimeout(tile._retry);
    clearTimeout(tile._shown);
    img.onerror = null;
    img.removeAttribute("src");   // aborts the MJPEG download
  }
  function attachAll() { tiles.forEach(attach); }
  function streamsWanted() { return full.hidden && birdsPanel.hidden && sightingsPanel.hidden; }

  function loadFull() {
    clearTimeout(fullRetry);
    full._pending = false;
    full._since = Date.now();
    if (fullTile) { fullImg.src = bust(fullTile.getAttribute("data-hd")); }
  }
  function openFull(tile) {
    tiles.forEach(detach);
    fullTile = tile;
    full._backoff = 5000;
    full.querySelector("figcaption").textContent = tile.querySelector("figcaption").textContent;
    fullImg.onload = function () { fullBadge.hidden = true; full._backoff = 5000; };
    fullImg.onerror = function () {
      if (full._pending) { return; }
      full._pending = true;
      fullBadge.hidden = false;
      clearTimeout(fullRetry);
      fullRetry = setTimeout(function () { if (fullTile === tile) { loadFull(); } }, full._backoff);
      full._backoff = Math.min(full._backoff * 2, 60000);
    };
    loadFull();
    full.hidden = false;   // stays until tapped
  }
  function closeFull() {
    clearTimeout(fullRetry);
    fullTile = null;
    fullImg.onerror = null;
    fullImg.onload = null;
    fullImg.removeAttribute("src");
    fullBadge.hidden = true;
    full.hidden = true;
    attachAll();
  }

  // ---- dimming ----------------------------------------------------------
  function setBrightness(level) {
    if (window.FrameNative && window.FrameNative.setBrightness) {
      window.FrameNative.setBrightness(level);
      return;
    }
    var shade = document.getElementById("dimmer");   // desktop fallback for testing
    shade.hidden = level < 0;
    shade.style.opacity = String(Math.min(0.97, 1 - Math.max(level, 0)));
  }
  function applyDim() {
    var want = dim.active && Date.now() >= wakeUntil;
    var level = want ? dim.level : -1;
    if (want === dimmed && level === appliedLevel) { return; }
    dimmed = want;
    appliedLevel = level;
    root.className = want ? "night" : "";   // red text; cameras fade further than the text
    setBrightness(level);
  }
  function wake() { wakeUntil = Date.now() + dim.wake * 1000; applyDim(); }
  function minutesOf(hhmm) {
    var parts = hhmm.split(":");
    return parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
  }
  // Mirrors wildlife.frame.schedule.in_window (wraps past midnight when start > end).
  function inDimWindow(date, start, end) {
    var now = date.getHours() * 60 + date.getMinutes();
    var begin = minutesOf(start);
    var finish = minutesOf(end);
    if (begin === finish) { return false; }
    return begin < finish ? (now >= begin && now < finish) : (now >= begin || now < finish);
  }

  // ---- taps -------------------------------------------------------------
  function handleTap(action) {
    return function () {
      if (dim.active && Date.now() >= wakeUntil) { wake(); return; }  // first tap only wakes
      if (dim.active) { wake(); }
      action(this);
    };
  }
  tiles.forEach(function (tile) { tile.addEventListener("click", handleTap(openFull)); });
  full.addEventListener("click", handleTap(closeFull));
  document.getElementById("strip").addEventListener("click", handleTap(function () {}));

  // ---- Home Assistant strip ---------------------------------------------
  function render(ha) {
    var weather = document.getElementById("weather");
    var values = document.getElementById("values");
    var rain = document.getElementById("rain");
    var conditions = document.getElementById("conditions");   // wind, sun, humidity, pressure
    clear(weather);
    clear(values);
    clear(rain);
    clear(conditions);
    rain.className = ha.stale ? "rain stale" : "rain";
    conditions.className = ha.stale ? "rain conditions stale" : "rain conditions";
    // Only the HA values fade when stale; the clock keeps full brightness.
    weather.className = ha.stale ? "weather stale" : "weather";
    values.className = ha.stale ? "stale" : "";
    ha.items.forEach(function (item) {
      if (item.slot === "weather" && !weather.firstChild) {
        weather.appendChild(el("div", "temp", item.display));
        weather.appendChild(el("div", "cond", item.detail));
        if (ha.forecast && ha.forecast.display) {   // formatted server-side; never "L 0°"
          weather.appendChild(el("div", "hilo", ha.forecast.display));
        }
        return;
      }
      var row = el("div", "row");
      row.appendChild(el("span", "label", item.label));
      var value = el("span", "value", item.display);
      if (item.flow) {   // battery in/out, signed server-side: "+1.3 A" charging, "−6.6 A" discharging
        value.appendChild(el("span", "flow", item.flow));
      }
      row.appendChild(value);
      if (item.slot === "rain") { rain.appendChild(row); }
      else if (item.slot === "conditions") { conditions.appendChild(row); }
      else { values.appendChild(row); }
    });
    if (ha.stale && ha.age_seconds !== null) {
      var mins = Math.round(ha.age_seconds / 60);
      values.appendChild(el("div", "age", mins < 1 ? "updated just now" : "updated " + mins + " min ago"));
    }
  }

  // ---- polling ----------------------------------------------------------
  function fail() {
    failures += 1;
    if (failures >= 3) { document.getElementById("offline").hidden = false; }
  }
  function poll() {
    var xhr = new XMLHttpRequest();
    xhr.open("GET", "/frame/state", true);
    xhr.timeout = 15000;   // > HA timeout (<= 5 s) for states + forecast
    xhr.onload = function () {
      var state;
      if (xhr.status !== 200) { fail(); return; }
      try { state = JSON.parse(xhr.responseText); } catch (e) { fail(); return; }
      if (failures >= 3 && streamsWanted()) { attachAll(); }   // server is back: reconnect streams
      failures = 0;
      document.getElementById("offline").hidden = true;
      offset = state.now * 1000 - Date.now();
      dim = {
        active: state.dim.active, level: state.dim.level, wake: state.dim.wake_seconds,
        start: state.dim.start, end: state.dim.end
      };
      applyDim();
      render(state.ha);
    };
    xhr.onerror = fail;
    xhr.ontimeout = fail;
    xhr.send();
  }

  // ---- wildlife sightings + birds -----------------------------------------
  var WILDLIFE_MS = 60 * 1000;
  var BIRDS_IDLE_MS = 60 * 1000;
  var SIGHTINGS_IDLE_MS = 60 * 1000;
  var birdsPanel = document.getElementById("birds");
  var sightingsPanel = document.getElementById("sightings");
  var sightingView = document.getElementById("sighting-view");
  var player = document.getElementById("player");
  var birdsTimer = null;
  var sightingsTimer = null;
  var latestBirds = [];
  var latestSightings = [];
  var playingButton = null;

  // A photo that fails to load (e.g. a bird with no cached reference photo) leaves
  // an empty space instead of Chrome's broken-image box; the layout stays put.
  function quietImg(img) {
    img.onerror = function () { img.style.visibility = "hidden"; };
    img.onload = function () { img.style.visibility = ""; };
    return img;
  }
  function showThumb(box, url, label, time) {
    var img = quietImg(box.querySelector("img"));
    if (url) { img.src = url; img.hidden = false; } else { img.hidden = true; }
    var cap = box.querySelector(".cap");   // name over time, each one line (never wraps mid-time)
    clear(cap);
    cap.appendChild(el("div", "cap-name", label));
    cap.appendChild(el("div", "cap-time", time));
    box.hidden = false;
  }
  function renderWildlife(w) {
    var sighting = document.getElementById("sighting");
    var bird = document.getElementById("bird");
    if (w.sighting) {
      showThumb(sighting, w.sighting.thumb_url, w.sighting.label, w.sighting.time);
    } else { sighting.hidden = true; }
    latestSightings = w.sightings || [];
    latestBirds = w.birds || [];
    if (latestBirds.length) {
      showThumb(bird, latestBirds[0].photo_url, latestBirds[0].label, latestBirds[0].time);
    } else { bird.hidden = true; }
  }
  function pollWildlife() {
    var xhr = new XMLHttpRequest();
    xhr.open("GET", "/frame/wildlife", true);
    xhr.timeout = 8000;
    xhr.onload = function () {
      if (xhr.status !== 200) { return; }
      try { renderWildlife(JSON.parse(xhr.responseText)); } catch (e) { /* keep the last panel */ }
    };
    xhr.send();
  }
  function resetPlaying() {
    if (playingButton) { playingButton.textContent = "\u25B6"; playingButton = null; }
  }
  function playClip(url, button) {
    bumpBirds();
    if (playingButton === button && !player.paused) { player.pause(); resetPlaying(); return; }
    resetPlaying();
    player.src = url;
    var started = player.play();
    if (started && started.catch) { started.catch(resetPlaying); }
    button.textContent = "\u25A0";
    playingButton = button;
  }
  player.addEventListener("ended", resetPlaying);
  player.addEventListener("error", resetPlaying);
  function renderBirdList() {
    var list = document.getElementById("bird-list");
    clear(list);
    latestBirds.forEach(function (bird) {
      var row = el("li", "bird-row");
      var img = quietImg(el("img"));
      img.alt = "";
      if (bird.photo_url) { img.src = bird.photo_url; }
      row.appendChild(img);
      var text = el("div", "bird-text");
      text.appendChild(el("div", "bird-name", bird.label));
      text.appendChild(el("div", "bird-meta", bird.time + (bird.confidence ? " \u00b7 " + bird.confidence : "")));
      row.appendChild(text);
      if (bird.audio_url) {
        var play = el("button", "play", "\u25B6");
        play.type = "button";
        play.addEventListener("click", function (ev) { ev.stopPropagation(); playClip(bird.audio_url, play); });
        row.appendChild(play);
      }
      list.appendChild(row);
    });
  }
  function bumpBirds() { clearTimeout(birdsTimer); birdsTimer = setTimeout(closeBirds, BIRDS_IDLE_MS); }
  function openBirds() {
    if (!latestBirds.length) { return; }
    tiles.forEach(detach);
    renderBirdList();
    birdsPanel.hidden = false;
    bumpBirds();
  }
  function closeBirds() {
    clearTimeout(birdsTimer);
    player.pause();
    player.removeAttribute("src");
    resetPlaying();
    birdsPanel.hidden = true;
    if (full.hidden) { attachAll(); }
  }
  document.getElementById("bird").addEventListener("click", handleTap(openBirds));

  // Recent sightings: a grid of the latest camera events; tap one to see the photo big.
  function sightingText(s) { return s.label + " \u00b7 " + s.camera + " \u00b7 " + s.time; }
  function showSighting(s) {
    sightingView.querySelector("img").src = s.image_url || s.thumb_url;
    sightingView.querySelector("figcaption").textContent = sightingText(s);
    sightingView.hidden = false;
  }
  function hideSighting() {
    sightingView.hidden = true;
    sightingView.querySelector("img").removeAttribute("src");   // drop the full-size photo
  }
  // The grid scrolls; nearing the bottom loads the next 12 older events from
  // /frame/sightings, back through all reviewed history. Closing clears it all.
  var sightingList = document.getElementById("sighting-list");
  var olderCursor = null;    // "ts" of the oldest event shown; null = nothing older
  var loadingOlder = false;
  var sightingsGen = 0;      // bumped on close so a page that lands late is dropped
  function sightingCell(s) {
    var cell = el("li", "sighting-cell");
    var img = quietImg(el("img"));
    img.alt = "";
    if (s.thumb_url) { img.src = s.thumb_url; }
    cell.appendChild(img);
    cell.appendChild(el("div", "sighting-name", s.label));
    cell.appendChild(el("div", "sighting-meta", s.camera + " \u00b7 " + s.time));
    cell.addEventListener("click", function (ev) { ev.stopPropagation(); bumpSightings(); showSighting(s); });
    return cell;
  }
  function sightingsFooter(text) {
    var footer = document.getElementById("sighting-footer");
    if (!footer) {
      footer = el("li", "sighting-footer");
      footer.id = "sighting-footer";
    }
    footer.textContent = text;
    sightingList.appendChild(footer);   // always the last item
  }
  function renderSightingList() {
    clear(sightingList);
    latestSightings.forEach(function (s) { sightingList.appendChild(sightingCell(s)); });
    olderCursor = latestSightings[latestSightings.length - 1].ts || null;
    sightingsFooter("");
  }
  function loadOlderSightings() {
    if (loadingOlder || !olderCursor) { return; }
    loadingOlder = true;
    var gen = sightingsGen;
    sightingsFooter("Loading\u2026");
    var xhr = new XMLHttpRequest();
    xhr.open("GET", "/frame/sightings?before=" + encodeURIComponent(olderCursor));
    xhr.timeout = 10000;
    xhr.onload = function () {
      if (gen !== sightingsGen) { return; }
      loadingOlder = false;
      var page = null;
      try { page = JSON.parse(xhr.responseText); } catch (e) { page = null; }
      if (xhr.status !== 200 || !page) { sightingsFooter(""); return; }   // the next scroll retries
      var footer = document.getElementById("sighting-footer");
      page.sightings.forEach(function (s) { sightingList.insertBefore(sightingCell(s), footer); });
      olderCursor = page.next;
      sightingsFooter(olderCursor ? "" : "No older sightings");
      loadIfNearBottom();   // a short page may not fill the screen yet
    };
    xhr.onerror = xhr.ontimeout = function () {
      if (gen !== sightingsGen) { return; }
      loadingOlder = false;
      sightingsFooter("");
    };
    xhr.send();
  }
  function loadIfNearBottom() {
    if (sightingList.scrollTop + sightingList.clientHeight >= sightingList.scrollHeight - 400) {
      loadOlderSightings();
    }
  }
  sightingList.addEventListener("scroll", function () { bumpSightings(); loadIfNearBottom(); });
  function bumpSightings() {
    clearTimeout(sightingsTimer);
    sightingsTimer = setTimeout(closeSightings, SIGHTINGS_IDLE_MS);
  }
  function openSightings() {
    if (!latestSightings.length) { return; }
    tiles.forEach(detach);
    renderSightingList();
    hideSighting();
    sightingsPanel.hidden = false;
    sightingList.scrollTop = 0;
    bumpSightings();
    loadIfNearBottom();   // the first 12 don't fill the grid, so fetch the next page now
  }
  function closeSightings() {
    clearTimeout(sightingsTimer);
    hideSighting();
    sightingsGen += 1;
    loadingOlder = false;
    olderCursor = null;
    clear(sightingList);
    sightingsPanel.hidden = true;
    if (streamsWanted()) { attachAll(); }
  }
  document.getElementById("sighting").addEventListener("click", handleTap(openSightings));
  document.getElementById("sightings-close").addEventListener("click", function (ev) {
    ev.stopPropagation();
    closeSightings();
  });
  sightingView.addEventListener("click", function (ev) { ev.stopPropagation(); bumpSightings(); hideSighting(); });
  sightingsPanel.addEventListener("click", bumpSightings);
  document.getElementById("birds-close").addEventListener("click", function (ev) {
    ev.stopPropagation();
    closeBirds();
  });
  birdsPanel.addEventListener("click", bumpBirds);

  // ---- clock + housekeeping ---------------------------------------------
  function tick() {
    var now = new Date(Date.now() + offset);
    // "4:18 PM" -> big "4:18" + small "PM" (newer ICU separates them with U+202F, which \s matches)
    var parts = now.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }).split(/\s+/);
    document.getElementById("hm").textContent = parts[0];
    document.getElementById("ampm").textContent = parts.slice(1).join(" ");
    document.getElementById("date").textContent =
      now.toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" });
    if (failures >= 3 && dim.start && dim.end) {
      dim.active = inDimWindow(now, dim.start, dim.end);   // server unreachable: keep the schedule
    }
    applyDim();
    // Daily fresh start to shed leaks on the 1 GB frame -- only while the server answers, so an
    // outage never swaps a working page for the kiosk's error screen.
    if (failures === 0 && now.getHours() === 4 && now.getMinutes() === 0 &&
        Date.now() - started > 120000) {
      location.reload();
    }
  }

  // A stream that ends mid-flight leaves the <img> complete with zero width and fires no
  // error event (seen in Chromium), so check for that and treat it as an error.
  function broken(img, since) {
    return img.getAttribute("src") && Date.now() - since > 8000 &&
      img.complete && img.naturalWidth === 0;
  }
  setInterval(function () {
    if (streamsWanted()) {
      tiles.forEach(function (tile) {
        var img = tile.querySelector("img");
        if (img.onerror && broken(img, tile._since)) { img.onerror(); }
      });
    } else if (fullTile && fullImg.onerror && broken(fullImg, full._since)) {
      fullImg.onerror();
    }
  }, 5000);

  attachAll();
  poll();
  tick();
  setInterval(poll, REFRESH_MS);
  setInterval(tick, 1000);
  setInterval(function () {
    if (streamsWanted()) { attachAll(); } else if (fullTile) { loadFull(); }
  }, STREAM_REFRESH_MS);
  pollWildlife();
  setInterval(pollWildlife, WILDLIFE_MS);
}());
</script>
</body>
</html>
